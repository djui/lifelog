name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: swift test
      - name: Build distributable
        run: ./scripts/build.sh
      - name: Smoke test packaged demo
        shell: bash
        run: |
          output="$RUNNER_TEMP/icloud-exporter-demo"
          ./dist/icloud-exporter.app/Contents/MacOS/icloud-exporter export --output "$output" --demo
          test -f dist/icloud-exporter.app/Contents/Resources/ICloudExporter_ICloudExporterCore.bundle/notes.js
          codesign -dv --verbose=4 dist/icloud-exporter.app 2>&1 | grep -q "Identifier=com.djui.icloud-exporter"
          test -s "$output/_index.md"
          test -s "$output/Reminders/current-reminders.md"
          test -s "$output/Reminders/completed-recent.md"
          test -s "$output/Calendar/upcoming-365-days.md"
          test -s "$output/Calendar/recent-365-days.md"
          test -d "$output/WhatsApp"
          test -n "$(ls "$output/WhatsApp"/*.md 2>/dev/null)"
      - name: Smoke test archive demo
        shell: bash
        run: |
          output="$RUNNER_TEMP/icloud-exporter-archive-demo"
          ./dist/icloud-exporter.app/Contents/MacOS/icloud-exporter archive --output "$output" --demo
          test -s "$output/_index.md"
          grep -q "| WhatsApp |" "$output/_index.md"
          test -n "$(ls "$output/.archive/ledger/whatsapp"/*.jsonl 2>/dev/null)"
          test -n "$(ls "$output/.archive/runs"/*.jsonl 2>/dev/null)"
          grep -q '"state":"expired"' "$output"/.archive/ledger/whatsapp/*.jsonl
          grep -q '"state":"revoked"' "$output"/.archive/ledger/whatsapp/*.jsonl
          grep -q '"state":"deleted"' "$output"/.archive/ledger/reminders/*.jsonl
          # A second demo into the same folder is refused, so demo data never mixes with a real archive.
          if ./dist/icloud-exporter.app/Contents/MacOS/icloud-exporter archive --output "$output" --demo; then exit 1; fi
          if ./dist/icloud-exporter.app/Contents/MacOS/icloud-exporter archive --output "$output" --sources claudecode; then exit 1; fi
