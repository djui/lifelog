name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: swift test
      - name: Run tests in UTC
        run: TZ=UTC swift test
      - name: Build distributable
        run: ./scripts/build.sh
      - name: Smoke test packaged demo
        shell: bash
        run: |
          output="$RUNNER_TEMP/lifelog-demo"
          ./dist/Lifelog.app/Contents/MacOS/lifelog export --output "$output" --demo
          # Newer toolchains nest bundle resources under Contents/Resources; older ones keep them flat.
          bundle=dist/Lifelog.app/Contents/Resources/Lifelog_LifelogCore.bundle
          test -f "$bundle/notes.js" || test -f "$bundle/Contents/Resources/notes.js"
          codesign -dv --verbose=4 dist/Lifelog.app 2>&1 | grep "Identifier=com.djui.lifelog" >/dev/null
          # The menu bar app: icon in the bundle; with arguments (or from a terminal) the binary stays the CLI.
          test -s dist/Lifelog.app/Contents/Resources/AppIcon.icns
          test "$(plutil -extract CFBundleIconFile raw dist/Lifelog.app/Contents/Info.plist)" = AppIcon
          ./dist/Lifelog.app/Contents/MacOS/lifelog --help | grep "lifelog app" >/dev/null
          test -s "$output/_index.md"
          test -s "$output/Reminders/current-reminders.md"
          test -s "$output/Reminders/completed-recent.md"
          test -s "$output/Calendar/upcoming-365-days.md"
          test -s "$output/Calendar/recent-365-days.md"
          test -d "$output/WhatsApp"
          test -n "$(ls "$output/WhatsApp"/*.md 2>/dev/null)"
      - name: Smoke test archive demo
        shell: bash
        run: |
          output="$RUNNER_TEMP/lifelog-archive-demo"
          ./dist/Lifelog.app/Contents/MacOS/lifelog archive --output "$output" --demo
          test -s "$output/_index.md"
          grep -q "| WhatsApp |" "$output/_index.md"
          test -n "$(ls "$output/.archive/ledger/whatsapp"/*.jsonl 2>/dev/null)"
          test -n "$(ls "$output/.archive/runs"/*.jsonl 2>/dev/null)"
          grep -q '"state":"expired"' "$output"/.archive/ledger/whatsapp/*.jsonl
          grep -q '"state":"revoked"' "$output"/.archive/ledger/whatsapp/*.jsonl
          grep -q '"state":"deleted"' "$output"/.archive/ledger/reminders/*.jsonl
          # Pages: month files, the Timeline and the _Disappeared digest, with gone items kept in place.
          grep -q "## Health" "$output/_index.md"
          test -n "$(ls "$output"/Timeline/*/*.md 2>/dev/null)"
          test -n "$(ls "$output"/_Disappeared/*/*.md 2>/dev/null)"
          test -s "$output/Reminders/open.md"
          grep -q "expired" "$output"/WhatsApp/*/*/*.md
          grep -q "~~" "$output"/Calendar/*/*.md
          # The offline HTML viewer, with its data as scripts; rebuild leaves it as it is too.
          test -s "$output/_viewer/index.html"
          test -s "$output/_viewer/app.js"
          test -s "$output/_viewer/data/manifest.js"
          grep -q "^window.ARCHIVE.load(" "$output/_viewer/data/manifest.js"
          test -n "$(ls "$output"/_viewer/data/whatsapp/*.js 2>/dev/null)"
          test -f dist/Lifelog.app/Contents/Resources/Lifelog_LifelogCore.bundle/viewer/index.html || test -f dist/Lifelog.app/Contents/Resources/Lifelog_LifelogCore.bundle/Contents/Resources/viewer/index.html
          ./dist/Lifelog.app/Contents/MacOS/lifelog rebuild --output "$output" | grep -q "0 pages written"
          # A second demo into the same folder is refused, so demo data never mixes with a real archive.
          if ./dist/Lifelog.app/Contents/MacOS/lifelog archive --output "$output" --demo; then exit 1; fi
          if ./dist/Lifelog.app/Contents/MacOS/lifelog archive --output "$output" --sources claudecode; then exit 1; fi
